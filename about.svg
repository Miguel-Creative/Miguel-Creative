<g class="ln" style="animation-delay:0.50s"><text class="nm" x="24" y="66">Miguel</text></g><g class="ln" style="animation-delay:0.82s"><text class="rl" x="24" y="90">Desenvolvedor Full-Stack</text></g><g class="ln" style="animation-delay:1.14s"><text class="fo" x="24" y="109">Fundador da Creative Zone</text></g><g class="ln" style="animation-delay:1.46s"><line x1="24" y1="123" x2="396" y2="123" stroke="#30363d" stroke-dasharray="2 4"/></g><g class="ln" style="animation-delay:1.78s"><text class="pg" x="24" y="143">Desenho e construo produtos digitais de ponta a</text><text class="pg" x="24" y="160">ponta — da arquitetura PostgreSQL/RLS às interfaces</text><text class="pg" x="24" y="177">web, apps mobile e agentes de IA. Integro MCP,</text><text class="pg" x="24" y="194">automação e infraestrutura para transformar fluxos</text><text class="pg" x="24" y="211">complexos em ferramentas úteis e operáveis.</text></g><g class="ln" style="animation-delay:2.10s"><text class="pg" x="24" y="237">Sou fundador da Creative Zone, um ecossistema de</text><text class="pg" x="24" y="254">tecnologia e comunidade onde ideias viram software,</text><text class="pg" x="24" y="271">produtos e colaboração. Trabalho com foco em</text><text class="pg" x="24" y="288">engenharia pragmática, segurança, experiência de uso</text><text class="pg" x="24" y="305">e entrega contínua.</text></g><g class="ln" style="animation-delay:2.42s"><text class="fk" x="24" y="333">› foco</text><text class="fv" x="88" y="333">Produtos · IA/MCP · automação</text></g><g class="ln" style="animation-delay:2.74s"><text class="fk" x="24" y="352">› front</text><text class="fv" x="88" y="352">React · TypeScript · TanStack · Tailwind</text></g><g class="ln" style="animation-delay:3.06s"><text class="fk" x="24" y="371">› back</text><text class="fv" x="88" y="371">Node.js · Supabase · PostgreSQL · Deno</text></g><g class="ln" style="animation-delay:3.38s"><text class="fk" x="24" y="390">› infra</text><text class="fv" x="88" y="390">Cloudflare · Docker · Caddy · GitHub Actions</text></g><g class="ln" style="animation-delay:3.70s"><text class="fk" x="24" y="409">› agora</text><text class="fv" x="88" y="409">Linkou · Meu Salão · Creative Lovable</text></g><g class="ln" style="animation-delay:4.02s"><text class="pr" x="24" y="416"><tspan class="pgr">miguel@creativezone</tspan>:~$ </text><rect class="cur" x="190" y="405" width="7.5" height="14" fill="#e6edf3"/></g>
