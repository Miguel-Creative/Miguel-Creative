<g class="ln" style="animation-delay:0.50s"><text class="nm" x="24" y="66">Miguel</text></g><g class="ln" style="animation-delay:0.82s"><text class="rl" x="24" y="90">Desenvolvedor Full-Stack</text></g><g class="ln" style="animation-delay:1.14s"><text class="fo" x="24" y="109">Fundador da Creative Zone</text></g><g class="ln" style="animation-delay:1.46s"><line x1="24" y1="123" x2="396" y2="123" stroke="#294464" stroke-dasharray="2 4"/></g><g class="ln" style="animation-delay:1.78s"><text class="pg" x="24" y="143">Construo produtos digitais de ponta a ponta:</text><text class="pg" x="24" y="160">arquitetura de dados, interfaces web, apps mobile e</text><text class="pg" x="24" y="177">agentes de IA. Integro MCP, automação e</text><text class="pg" x="24" y="194">infraestrutura para transformar fluxos complexos em</text><text class="pg" x="24" y="211">ferramentas úteis.</text></g><g class="ln" style="animation-delay:2.10s"><text class="pg" x="24" y="237">Fundei a Creative Zone, ecossistema de tecnologia e</text><text class="pg" x="24" y="254">comunidade onde ideias viram software e colaboração.</text></g><g class="ln" style="animation-delay:2.42s"><text class="fk" x="24" y="282">› foco</text><text class="fv" x="88" y="282">Produtos · IA/MCP · automação</text></g><g class="ln" style="animation-delay:2.74s"><text class="fk" x="24" y="301">› front</text><text class="fv" x="88" y="301">React · TypeScript · TanStack · Tailwind</text></g><g class="ln" style="animation-delay:3.06s"><text class="fk" x="24" y="320">› back</text><text class="fv" x="88" y="320">Node.js · Supabase · PostgreSQL · Deno</text></g><g class="ln" style="animation-delay:3.38s"><text class="fk" x="24" y="339">› infra</text><text class="fv" x="88" y="339">Cloudflare · Docker · Caddy · GitHub Actions</text></g><g class="ln" style="animation-delay:3.70s"><text class="fk" x="24" y="358">› agora</text><text class="fv" x="88" y="358">Linkou · Meu Salão · Creative Lovable</text></g><g class="ln" style="animation