<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-label="Sobre Miguel e suas capacidades">
<title>Sobre Miguel e suas capacidades</title><defs>
<linearGradient id="about-line" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<linearGradient id="about-shade" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#070b16"/><stop offset="1" stop-color="#12223b"/></linearGradient>
<pattern id="about-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#294464" opacity=".33"/></pattern></defs>
<style>@font-face{font-family:'CZ Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'CZ Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'CZ Mono',Arial,Helvetica,sans-serif}
.float{animation:levitate 5.5s ease-in-out infinite}
@keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes swing{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="859" height="479" rx="22" fill="url(#about-shade)" stroke="#294464"/>
<rect x="1" y="1" width="858" height="478" rx="22" fill="url(#about-dots)"/>
<rect x="22" width="72" height="5" rx="2" fill="#247bff"/><rect x="100" width="36" height="5" rx="2" fill="#ff354f"/><rect x="142" width="20" height="5" rx="2" fill="#ff354f" opacity=".65"/>
<text x="40" y="61" font-size="23" fill="#f3f6ff" font-weight="700" >01   /   SOBRE MIM</text><line x1="40" y1="76" x2="820" y2="76" stroke="url(#about-line)"/><text x="40" y="115" font-size="12" fill="#247bff" font-weight="700" >QUEM SOU  /  O QUE CONSTRUO</text><text x="42" y="150" font-size="14" fill="#f3f6ff" font-weight="400" >Construo produtos digitais de ponta a ponta: arquitetura</text><text x="42" y="172" font-size="14" fill="#f3f6ff" font-weight="400" >de dados, interfaces web, apps mobile e agentes de IA.</text><text x="42" y="194" font-size="14" fill="#f3f6ff" font-weight="400" >Integro MCP, automação e infraestrutura para transformar</text><text x="42" y="216" font-size="14" fill="#f3f6ff" font-weight="400" >fluxos complexos em ferramentas úteis.</text><text x="42" y="254" font-size="14" fill="#f3f6ff" font-weight="400" >Fundei a Creative Zone, ecossistema de tecnologia e</text><text x="42" y="276" font-size="14" fill="#f3f6ff" font-weight="400" >comunidade onde ideias viram software e colaboração.</text><rect x="40" y="319" width="474" height="3" rx="2" fill="#247bff"/><text x="42" y="353" font-size="12" fill="#aabbd0" font-weight="700" >Desenvolvedor Full-Stack  ·  Fundador da Creative Zone</text><rect x="548" y="99" width="274" height="329" rx="18" fill="#111f35" stroke="#294464"/><text x="568" y="129" font-size="13" fill="#ff354f" font-weight="700" >CAPACIDADES</text><rect x="565" y="145" width="240" height="42" rx="9" fill="#0c172a" stroke="#243b5c"/><text x="575" y="163" font-size="10" fill="#247bff" font-weight="700" >FOCO</text><text x="575" y="179" font-size="10.5" fill="#f3f6ff" font-weight="400" >Produtos · IA/MCP · automação</text><rect x="565" y="194" width="240" height="42" rx="9" fill="#0c172a" stroke="#243b5c"/><text x="575" y="212" font-size="10" fill="#247bff" font-weight="700" >FRONT</text><text x="575" y="228" font-size="9.4" fill="#f3f6ff" font-weight="400" >React · TypeScript · TanStack · Tailwind</text><rect x="565" y="243" width="240" height="42" rx="9" fill="#0c172a" stroke="#243b5c"/><text x="575" y="261" font-size="10" fill="#247bff" font-weight="700" >BACK</text><text x="575" y="277" font-size="9.4" fill="#f3f6ff" font-weight="400" >Node.js · Supabase · PostgreSQL · Deno</text><rect x="565" y="292" width="240" height="42" rx="9" fill="#0c172a" stroke="#243b5c"/><text x="575" y="310" font-size="10" fill="#247bff" font-weight="700" >INFRA</text><text x="575" y="326" font-size="9.4" fill="#f3f6ff" font-weight="400" >Cloudflare · Docker · Caddy · GitHub Actions</text><rect x="565" y="341" width="240" height="42" rx="9" fill="#0c172a" stroke="#243b5c"/><text x="575" y="359" font-size="10" fill="#247bff" font-weight="700" >AGORA</text><text x="575" y="375" font-size="9.4" fill="#f3f6ff" font-weight="400" >Linkou · Meu Salão · Creative Lovable</text></svg>